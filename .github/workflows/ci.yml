# main への push と Pull Request のたびにビルドが通るか確認する
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # ビルド番号 (コミット数) の計算に全履歴が必要

      - name: ツールチェーンの確認
        run: swift --version

      - name: VERSION の形式チェック
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION || { echo "::error::VERSION は X.Y.Z 形式にしてください"; exit 1; }

      - name: ビルド (debug)
        run: swift build

      - name: アプリのビルド (release)
        run: ./build_app.sh --no-open
