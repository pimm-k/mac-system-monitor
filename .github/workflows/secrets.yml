# gitleaks: トークン・パスワードなどの秘密情報がコミットされていないかを検査する
# (非公開リポジトリでは GitHub の Secret scanning が無料で使えないため、その代わり)
# Linux ランナーで動かすので、Actions の無料枠をほとんど使わない
name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 18 * * 0'   # 毎週月曜 3:23 (日本時間) に全履歴を検査

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 全履歴を検査する

      - name: gitleaks で検査
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --no-banner
